name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the checker on the sample log
        # The sample data is synthetic and lives in the repository, so the tool
        # itself runs here and its findings show up in the build log.
        run: python can_check.py run01_frenada_musplit.asc chassis.dbc

      - name: Tests
        run: python -m pytest -v
